name: Update important dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Update range for npm-check-updates"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - latest

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh important npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Update package ranges
        run: |
          npx npm-check-updates \
            --upgrade \
            --target "${{ inputs.target || 'minor' }}" \
            --reject "typescript,@types/node,@wppconnect/wa-js"

      - name: Update compatible compiler and Node types
        run: |
          npx npm-check-updates --upgrade --target minor --filter "typescript,@types/node"

      - name: Install updated dependencies
        run: |
          if ! git diff --quiet HEAD -- package.json; then
            npm install
          else
            echo "Package ranges are unchanged; preserve the existing lockfile."
          fi

      - name: Test release downloader
        run: npm run test:unit

      - name: Validate locale JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/_locales/en/messages.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/_locales/pt_BR/messages.json','utf8'))"

      - name: Build extension
        run: npm run build

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update important dependencies"
          title: "chore: update important dependencies"
          body: |
            ## Summary
            - Updates important runtime, React, build, and test dependencies.
            - Preserves the lockfile when package ranges are unchanged.
            - Runs clean install, unit tests, locale JSON validation, and production build before opening the PR.

            ## Validation
            - npm ci
            - npm install when package ranges change
            - npm run test:unit
            - locale JSON parse check
            - npm run build
          branch: chore/update-important-dependencies
          delete-branch: true
          labels: dependencies
