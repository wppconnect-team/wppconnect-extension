version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      wa-js:
        patterns:
          - "@wppconnect/wa-js"
      runtime:
        patterns:
          - "react"
          - "react-dom"
          - "scheduler"
      react-types:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      build-tooling:
        patterns:
          - "typescript"
          - "webpack-*"
          - "ts-loader"
          - "copy-webpack-plugin"
          - "css-*"
          - "postcss-*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@tsconfig/*"
          - "postcss"
          - "autoprefixer"
          - "mini-css-extract-plugin"
          - "speed-measure-webpack-plugin"
          - "rimraf"
      platform-types:
        patterns:
          - "@types/chrome"
          - "@types/node"
      test-tooling:
        patterns:
          - "@playwright/test"
          - "qrcode-terminal"
